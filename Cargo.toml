[package]
name = "tablo"
version = "1.0.0"
edition = "2021"
rust-version = "1.84"
description = "Inspect tabular data (CSV, TSV, and JSONL) in the terminal"
license = "MIT"
repository = "https://github.com/SantosJGND/Tablo"
readme = "README.md"
keywords = ["csv", "tsv", "jsonl", "table", "cli"]
categories = ["command-line-utilities", "parsing", "text-processing"]
exclude = ["/instructions*.md", "/instrcutions*.md"]

[dependencies]
clap = { version = "=4.4.18", features = ["derive"] }
csv = "=1.3.0"
anyhow = "=1.0.75"
terminal_size = "=0.3.0"
unicode-width = "=0.1.11"
serde_json = "=1.0.154"
owo-colors = "=4.4.0"
